manipulation_task_server:
  ros__parameters:
    mtc:
      arm_group_name: "interbotix_arm"
      hand_group_name: "interbotix_gripper"
      hand_frame: "wx200/ee_gripper_link"   # Interbotix prefixes link names with <robot_name>; default robot_name is "wx200"
      world_frame: "wx200/base_link"
      surface_link: "map"
      # SRDF named group states (from the Interbotix SRDF, e.g. wx200.srdf.xacro)
      hand_open_state: "Released"
      hand_closed_state: "Grasping"
      arm_home_state: "Sleep"      # final resting pose
      arm_ready_state: "Sleep"      # pose held after a successful pick
      approach_min: 0.03
      approach_max: 0.15
      lift_min: 0.01
      lift_max: 0.15
      place_lower_min: 0.02      # place "lower" descent above the place point (smaller for shelves)
      place_lower_max: 0.06
      retreat_min: 0.03
      retreat_max: 0.25
      max_solutions: 2
      grasp_angle_delta: 0.262
      grasp_offset: 0.055          # along the approach axis (negative = grasp deeper toward the arm)
      # Rotation [roll, pitch, yaw] from hand_frame to the grasp IK frame (IK-frame X = approach).
      # The Interbotix ee_gripper_link is already X-forward, so no rotation is needed.
      grasp_frame_rpy: [0.0, 0.0, 0.0]
      # Post-pick grasp verification thresholds for 'left_finger' (0.037 fully open).
      grasp_check:
        enabled: true
        closed_position: 0.022    # finger position when fully closed (empty)
        min_gap: 0.001            # min opening above closed_position to count as "holding"
