# Robot body collision, shared by manipulation_task_server (MTC) and manipulator_interface (primitives)
/**:
  ros__parameters:
    mtc:
      robot_collision_frame: "link_base"
      robot_collision_id: "boris_robot"
    boris_robot:
      base:
        # Dimensions of the BORIS base collision box (meters)
        size_x: 0.577045
        size_y: 0.434
        size_z: 0.493089
        # Offset relative to the robot collision frame (e.g., link_base)
        offset_x: -0.102573
        offset_y: 0.0
        offset_z: -0.26
      torso:
        # Dimensions of the BORIS torso collision box (meters)
        size_x: 0.234
        size_y: 0.274
        size_z: 0.8
        # Offset relative to the robot collision frame (e.g., link_base)
        offset_x: -0.217573
        offset_y: 0.0
        offset_z: 0.36
      sick:
        # Conservative box around the SICK LMS1xx collision mesh (meters)
        size_x: 0.125737
        size_y: 0.102200
        size_z: 0.152269
        # Offset relative to link_base; derived from fbot_description v2.yaml
        offset_x: 0.215030
        offset_y: 0.0
        offset_z: -0.082258
      femtobolt:
        # Femto Bolt housing dimensions from fbot_description v2 (meters)
        size_x: 0.065
        size_y: 0.115
        size_z: 0.040
        # Offset relative to link_base; derived from the v2 neck and arm mount
        offset_x: -0.057048
        offset_y: 0.0
        offset_z: 0.848650
      femtobolt_support:
        # Head tilt support collision from fbot_description/urdf/v2/neck.xacro
        size_x: 0.040
        size_y: 0.115
        size_z: 0.065
        # Same neutral link_base position as the Femto Bolt mount
        offset_x: -0.057048
        offset_y: 0.0
        offset_z: 0.848650
      femtobolt_pan_support:
        # Head pan support collision from fbot_description/urdf/v2/neck.xacro
        size_x: 0.050
        size_y: 0.050
        size_z: 0.063
        # Offset relative to link_base; overlaps the dorso collision
        offset_x: -0.076073
        offset_y: 0.0
        offset_z: 0.777300
