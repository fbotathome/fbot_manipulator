manipulation_task_server:
  ros__parameters:
    mtc:
      arm_group_name: "xarm6"
      hand_group_name: "xarm_gripper"
      hand_frame: "link_tcp"
      world_frame: "world"
      surface_link: "world"
      persistent_robot_collision: true
      approach_min: 0.03
      approach_max: 0.15
      lift_min: 0.05
      lift_max: 0.15
      retreat_min: 0.05
      retreat_max: 0.10
      max_solutions: 3
      grasp_angle_delta: 0.262
      pour_angle_delta: 2.095 # 120 degrees in radians
      pour_side_offset: 0.10
      pour_above_offset: 0.15
      pour_wait_time: 2.0
      grasp_offset: -0.02
      # Post-pick grasp check: after a PICK, abort if the gripper joint stopped within min_gap of
      # closed_position (closed on nothing).
      # TODO: PLACEHOLDER VALUES - measure closed_position / min_gap on the real gripper, then
      # set enabled: true.
      grasp_check:
        enabled: true
        topic: "/joint_states"
        finger_joint: "drive_joint"
        closed_position: 0.85     # drive_joint when fully closed on nothing (placeholder)
        min_gap: 0.01             # min distance from closed_position to count as holding (placeholder)
